name: bookstore

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the ignored .env file}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -C -b -l 5 -Q "SELECT 1" > /dev/null
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  auth:
    profiles: [demo]
    build:
      context: .
      dockerfile: src/Bookstore.Auth/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:7200
      DataProtection__KeysPath: /data-protection-keys
    ports:
      - "127.0.0.1:7200:7200"
    volumes:
      - type: bind
        source: ./.local/docker/auth.json
        target: /app/appsettings.Development.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/docker/https
        target: /https
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/docker/oauth
        target: /oauth
        read_only: true
        bind:
          create_host_path: false
      - auth-data-protection:/data-protection-keys
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --cacert, /https/localhost.crt, https://localhost:7200/health]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  api:
    profiles: [demo]
    build:
      context: .
      dockerfile: src/Bookstore.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:7100
      Authentication__Authority: https://localhost:7200/
      Authentication__BackchannelHost: auth
      SSL_CERT_FILE: /https/localhost.crt
    ports:
      - "127.0.0.1:7100:7100"
    volumes:
      - type: bind
        source: ./.local/docker/api.json
        target: /app/appsettings.Development.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/docker/https
        target: /https
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      sqlserver:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --cacert, /https/localhost.crt, https://localhost:7100/health]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  sqlserver-data:
  auth-data-protection:
